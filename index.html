<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Procedural Mumbai</title>
<meta name="description" content="A real-time 3D model of Mumbai, built from OpenStreetMap data." />
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05070a;
    overflow: hidden;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  #app {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #05070a;
    color: #cfe4ec;
    z-index: 50;
    transition: opacity 0.6s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading h1 {
    font-size: 15px;
    letter-spacing: 0.3em;
    font-weight: 400;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 0;
  }
  #loading .bar {
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
    border-radius: 2px;
  }
  #loading .bar > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4fd1c5, #9ae6ff);
    transition: width 0.25s ease;
  }
  #loading .status {
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0.55;
    text-transform: uppercase;
  }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    font-size: 12px;
    color: #cfe4ec;
  }
  #hud .corner {
    position: absolute;
    pointer-events: auto;
  }
  #hud .title {
    top: 18px;
    left: 20px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 12px;
    opacity: 0.8;
  }
  #hud .title small {
    display: block;
    font-size: 10px;
    letter-spacing: 0.15em;
    opacity: 0.55;
    margin-top: 4px;
  }
  #hud .controls {
    bottom: 18px;
    left: 20px;
    display: flex;
    gap: 8px;
  }
  #hud button {
    pointer-events: auto;
    background: rgba(10,16,22,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    color: #cfe4ec;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s, border-color 0.2s;
  }
  #hud button:hover {
    background: rgba(79,209,197,0.18);
    border-color: rgba(79,209,197,0.5);
  }
  #hud button.active {
    background: rgba(79,209,197,0.28);
    border-color: #4fd1c5;
    color: #e9fffb;
  }
  #hud .attribution {
    bottom: 18px;
    right: 20px;
    text-align: right;
    font-size: 10px;
    opacity: 0.45;
    line-height: 1.6;
    max-width: 260px;
  }
  #hud .attribution a {
    color: #9ae6ff;
    text-decoration: none;
  }
  #hud .help {
    top: 18px;
    right: 20px;
    text-align: right;
    font-size: 10px;
    opacity: 0.4;
    line-height: 1.6;
    max-width: 200px;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="corner title">
      Mumbai <small>procedural city &middot; built from OpenStreetMap</small>
    </div>
    <div class="corner help">
      drag to orbit &middot; scroll to zoom<br/>right-drag to pan
    </div>
    <div class="corner controls">
      <button id="btn-day">Day</button>
      <button id="btn-night" class="active">Night</button>
      <button id="btn-spin">Auto-rotate</button>
      <button id="btn-reset">Reset view</button>
    </div>
    <div class="corner attribution">
      Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors (ODbL)<br/>
      Inspired by <a href="https://github.com/jeantimex/tokyo" target="_blank" rel="noopener">jeantimex/tokyo</a>
    </div>
  </div>

  <div id="loading">
    <h1>Mumbai</h1>
    <div class="bar"><div id="loading-fill"></div></div>
    <div class="status" id="loading-status">fetching city data…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
